definitions:
  models.BetSuccessResponse:
    properties:
      bet_id:
        description: BetID bet id that was created
        type: string
      data:
        description: Message status description
        type: string
      status:
        description: Status http status code
        type: integer
    required:
    - bet_id
    - data
    - status
    type: object
  models.Category:
    properties:
      description:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
    type: object
  models.CreateMarketAlias:
    properties:
      alias:
        description: Alias custom alias
        type: string
      market_id:
        description: MarketID market ID
        type: integer
      outcome_id:
        description: OutcomeID market outcome ID
        type: string
      specifier:
        description: Specifier market line specifier
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error_code:
        description: ErrorCode error status code
        type: integer
      error_message:
        description: ErrorMessage status description
        type: string
    required:
    - error_code
    - error_message
    type: object
  models.Inbox:
    properties:
      inbox_id:
        description: InboxID id of the message
        type: integer
      message:
        description: Message sms sent by user
        type: string
      msisdn:
        description: Msisdn mobile number
        type: string
    type: object
  models.Keyword:
    properties:
      category_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      keyword:
        type: string
    type: object
  models.MarketAlias:
    properties:
      alias:
        description: Alias custom alias
        type: string
      id:
        description: ID
        type: integer
      market_id:
        description: MarketID market ID
        type: integer
      market_name:
        description: MarketName market name
        type: string
      outcome_id:
        description: OutcomeID market outcome ID
        type: string
      specifier:
        description: Specifier market line specifier
        type: string
    type: object
  models.SuccessResponse:
    properties:
      data:
        description: Message status description
        type: string
      status:
        description: Status http status code
        type: integer
    required:
    - data
    - status
    type: object
  models.Template:
    properties:
      content:
        description: Content content of the sms template
        type: string
      name:
        description: Name name of the sms template
        enum:
        - JOIN
        - HELP
        - BALANCE_QUERY
        - SMS_GAMES
        type: string
    required:
    - content
    - name
    type: object
  models.USSD:
    properties:
      code:
        description: ussd code
        type: string
      input:
        description: INPUT
        type: string
      level:
        description: level
        type: integer
      msisdn:
        description: Msisdn mobile number
        type: integer
      network:
        description: network
        type: string
      session:
        description: user Session
        type: string
      text:
        description: Message sms sent by user
        type: string
    type: object
  models.UpdateStatus:
    properties:
      is_active:
        type: boolean
    type: object
  models.UssdResponse:
    properties:
      responseType:
        type: string
      text:
        type: string
    type: object
  models.VueTable:
    properties:
      client_id:
        type: integer
      download:
        type: integer
      end_date:
        type: string
      id:
        type: integer
      page:
        type: integer
      per_page:
        type: integer
      search:
        type: string
      sort:
        type: string
      start_date:
        type: string
      status:
        type: integer
      user_type:
        type: integer
    type: object
info:
  contact:
    email: tech@maybets.com
