syntax = "proto3";
option go_package = "bitbucket.org/maybets/shortcode-service/app/grpc/shortcode";
package protobuf;

// The Odds service definition.
service Shortcode {
  // Sends GetOdds status request
  rpc IncomingSMS (IncomingRequest) returns (IncomingResponse) {}
  rpc GetSMSGames (SmsRequest) returns (SmsResponse) {}
  rpc Ping (ShortCodePing) returns (ShortCodePong) {}
}

// The request message containing the selection details.
message IncomingRequest {
  int64 Msisdn = 1;
  string Message = 2;
}

message IncomingResponse {
  int32 Status = 1;
  string Description = 2;
}

message SmsRequest {
  int32 ProfileId = 1;
  int32 Count = 2;
}

message SmsResponse {
  string Message = 1;
}

message ShortCodePing {

}

message ShortCodePong {
  int64 Status = 1;
  string Data = 2;
}
