syntax = "proto3";
option go_package = "bitbucket.org/maybets/bonus-service/app/grpc/bonus";
package protobuf;

// The Bonus service definition.
service Bonus {

  // Sends GetOdds status request
  rpc AwardBonus (AwardBonusRequest) returns (GeneralResponse){}
  rpc PlaceBonusBet(UserBet) returns (PlaceBetResponse){}
  rpc UpdateBetID(UpdateBetIDRequest) returns (GeneralResponse){}
  rpc DebitBonus(BonusDebitRequest) returns (GeneralResponse){}
  rpc BonusBalance(BonusBalanceRequest) returns (BonusBalanceResponse){}
  rpc Ping (BonusPing) returns (BonusPong) {}

}

message BonusPing {

}

message BonusPong {
  int64 Status = 1;
  string Data = 2;
}

message UpdateBetIDRequest {
  int64 TransactionID  = 1;
  int64 BetID  = 2;
}

message GeneralResponse {
  string description = 1;
  int32 status = 2;
}

message AwardBonusRequest {
  int64 BonusId = 1;
  int64 ProfileID = 2;
  float Amount = 3;
  float BaseValue = 4;
  int64 TransactionID = 5;
  string Description = 6;
  string BonusType = 7;
}

message UserBet {
  repeated BetSlip betslip = 1;
  int32 ProfileID = 2;
  float stake = 3;
  float totalOdds = 4;
  int32 bonusId = 5;
  string BonusCode = 6;
  string UTMSource = 7;
  string Campaign = 8;
  string Medium = 9;

}

message PlaceBetResponse {
  int64 TransactionID = 1;
  int64 status = 2;
  string statusDescription = 3;
  int64 PossibleWin = 4;
}

message BetSlip {
  int64 eventId = 1;
  int32 producerId = 2;
  float odds = 3;
  int64 sportId = 4;

}

message BonusDebitRequest {
  int64 BonusId = 1;
  int64 ProfileID = 2;
  float Amount = 3;
  int64 TransactionID = 4;
  string Description = 5;
  string BonusType = 6;
}

message BonusBalanceRequest {
  int64 ProfileID = 1;
}

message BonusBalanceResponse {
  float Balance = 1;
  string ExpiryDate = 2;
}